# 一加分屏增强修改了 CanvasPlus 的构建工作流。
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # runner 自带 Android SDK，这里只补 platform 和 build-tools
      - name: 安装 platform 36 和 build-tools 36
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMGR="$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1)"
          if [ -z "$SDKMGR" ]; then SDKMGR="$(command -v sdkmanager)"; fi
          echo "sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-36" "build-tools;36.0.0"

      - name: 编译
        run: bash build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: OnePlusSplitScreenEnhancer
          path: dist/OnePlusSplitScreenEnhancer.apk
